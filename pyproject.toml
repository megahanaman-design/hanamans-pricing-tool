[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanamans-pricing-core"
version = "0.2.0"
description = "Core pricing calculations for Hanaman's pricing tools"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3,<4",
    "whitenoise>=6.9,<7.0",
]

[tool.setuptools]
packages = ["pricing_core"]
